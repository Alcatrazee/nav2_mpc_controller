controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "nav2_mpc_controller/MPCController"

      # =========================================================================
      # 1. MPC 预测时域与时间离散化参数
      # =========================================================================
      N: 30                           # 预测时域步数 (Horizon Steps)
      dt: 0.05                         # 预测步长 (秒, Horizon Time = N * dt = 1.0s)

      # =========================================================================
      # 2. 机器人运动学与动力学极限约束 (Kinematic & Dynamic Bounds)
      # =========================================================================
      v_max: 0.50                     # 最大前进线速度 [m/s]
      v_min: 0.00                     # 最小线速度 (单向差分轮设为 0.0) [m/s]
      w_max: 1.20                     # 最大角速度 [rad/s]
      w_min: -1.20                    # 最小角速度 [rad/s]
      a_max: 1.00                     # 最大线加速度 [m/s²]
      a_min: -1.00                    # 最大线减速度 [m/s²]

      # =========================================================================
      # 3. Frenet 状态误差跟踪代价权重 (Frenet State Tracking Costs)
      # =========================================================================
      q_s: 2.0                        # 纵向弧长跟踪权重 (s - s_ref)
      q_d: 20.0                       # 横向偏差跟踪权重 (d - 0)，跟踪全局平滑参考线
      q_e_psi: 8.0                    # 航向角误差权重 (e_psi - 0)

      # =========================================================================
      # 4. 控制量与控制变化率代价权重 (Control Effort & Smoothness Costs)
      # =========================================================================
      r_v: 1.0                        # 线速度跟踪权重 (v - v_ref)
      r_w: 1.0                        # 角速度跟踪权重 (w - w_ref)
      r_a: 0.2                        # 加速度惩罚权重 (a)

      # =========================================================================
      # 5. 基于参考路线的安全走廊与防自交叉配置 (Safe Corridor Settings)
      # =========================================================================
      enable_safe_corridor: true      # 安全走廊总开关 (true: 走廊绕障模式; false: 纯跟线模式)
      corridor_default_left_width: 0.80   # 走廊默认最大左侧宽度 [m]
      corridor_default_right_width: 0.80  # 走廊默认最大右侧宽度 [m]
      corridor_min_width: 0.35            # 走廊最小有效通行宽度 [m]
      corridor_curvature_safety_factor: 0.85 # 曲率中心奇异点防护因子 (alpha / kappa)
      corridor_rib_safety_margin: 0.05    # 相邻截面肋线收缩保护裕量 [m]
      corridor_max_lateral_rate: 0.40     # 走廊横向最大变化坡度 (双向平滑滤波器)
      corridor_avoid_hairpin: true        # 180°掉头弯自交叉全局消除开关
      corridor_check_costmap: true        # 是否从 Costmap 提取障碍物收缩走廊
      corridor_costmap_cost_threshold: 100 # Costmap 障碍代价阈值 (默认100，包含膨胀层，进入即收缩走廊)

      # =========================================================================
      # 6. 平底锅式边缘死区二次代价与松弛约束 (Deadband Barrier & Slack Constraints)
      # =========================================================================
      corridor_buffer_margin: 0.15    # 走廊边缘死区缓冲裕量 [m] (开阔区代价恒为 0，免疫点云噪点)
      q_corridor_bound: 35.0          # 走廊边缘二次平滑排斥势场权重
      q_corridor_center: 30.0         # 窄通道自适应居中势场权重 (宽度越窄居中推力成平方倍放大)
      w_corridor_slack: 1000.0        # 走廊软约束越界松弛变量惩罚权重 (保证 100% 可行解)

      # =========================================================================
      # 7. 终点位姿物理连续漏斗约束与终端代价 (Terminal Goal Pose Constraints)
      # =========================================================================
      enable_terminal_constraint: true # 终点位姿约束开关
      goal_approach_dist: 0.60         # 终点进近模式距离阈值 [m]
      terminal_s_tol: 0.05             # 终点纵向位置容差 [m]
      terminal_d_tol: 0.03             # 终点横向偏差容差 [m] (强制厘米级精准对齐)
      terminal_epsi_tol: 0.05          # 终点航向角误差容差 [rad] (约 2.8°)
      terminal_v_tol: 0.01             # 终点末端速度容差 [m/s]
      q_s_terminal: 10.0               # 终端纵向代价权重
      q_d_terminal: 50.0               # 终端横向代价权重 (强拉引横向归零)
      q_epsi_terminal: 20.0            # 终端航向代价权重 (强拉引对齐目标朝向)
      r_v_terminal: 10.0               # 终端速度代价权重 (强拉引平稳停稳)
